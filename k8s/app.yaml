apiVersion: apps/v1
kind: Deployment
metadata:
  name: maolabs-blog
  namespace: maolabs
  labels:
    app: maolabs-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maolabs-blog
  template:
    metadata:
      labels:
        app: maolabs-blog
    spec:
      # Se a sua imagem no GHCR for privada, você precisa deste secret.
      # Se for pública (recomendado para o blog), você pode comentar estas duas linhas.
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: blog
        image: ghcr.io/maolabs-dev/blog:latest
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "false"
        - name: LOG_CHANNEL
          value: "stderr" # Garante que os erros apareçam no kubectl logs
        - name: SESSION_DRIVER
          value: "cookie" # Sem banco de dados
        - name: CACHE_STORE
          value: "file"
        - name: QUEUE_CONNECTION
          value: "sync"
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: blog-secrets
              key: APP_KEY
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: maolabs-blog-service
  namespace: maolabs
spec:
  selector:
    app: maolabs-blog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
